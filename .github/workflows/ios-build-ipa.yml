name: Build iOS IPA

# Full RoboVM AOT build of the iOS app on a macOS runner, producing an
# UNSIGNED IPA for AltStore Classic.
#
# The AOT compile takes ~30-60 minutes on a hosted macOS runner, so the workflow
# can be started manually or every day at 06:30 Europe/Rome. Once started,
# publishing is fully automatic:
# upstream sync -> build -> GitHub Release -> AltStore Classic source update.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle identifier for the build'
        required: false
        default: 'forge.cardforge.ios'
      release_notes:
        description: 'Optional notes shown in the GitHub Release and AltStore'
        required: false
        default: ''
  schedule:
    - cron: '30 6 * * *'
      timezone: 'Europe/Rome'
  push:
    # Editing the publisher workflow itself self-tests the full pipeline.
    # Normal source pushes do NOT trigger the expensive iOS AOT build.
    paths:
      - '.github/workflows/ios-build-ipa.yml'

permissions:
  contents: write

concurrency:
  group: forge-ios-daily-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    name: RoboVM iOS build + AltStore publish
    env:
      APP_ID: ${{ github.event.inputs.bundle_id || 'forge.cardforge.ios' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync Card-Forge upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Card-Forge/forge.git
          git fetch --no-tags upstream master

          git checkout master
          BEFORE="$(git rev-parse HEAD)"

          if ! git merge --no-edit upstream/master; then
            git merge --abort || true
            echo "::error::Automatic upstream merge conflicted. Master was left unchanged; resolve the conflict manually before the next daily build."
            exit 1
          fi

          AFTER="$(git rev-parse HEAD)"
          if [[ "$AFTER" != "$BEFORE" ]]; then
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "source_sha=$AFTER" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/master)" >> "$GITHUB_OUTPUT"
          echo "Build source: $AFTER"
          echo "Upstream:     $(git rev-parse upstream/master)"

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache pipeline tool jars
        uses: actions/cache@v5
        with:
          path: tmp/jvmdg/tools
          key: jvmdg-tools-${{ hashFiles('forge-gui-ios/pipeline/ios-pipeline.sh') }}

      - name: Cache RoboVM SDK + AOT cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.robovm
          key: robovm-${{ runner.os }}-${{ hashFiles('forge-gui-ios/pom.xml') }}

      - name: Set unique iOS build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("forge-gui-ios/robovm.properties.template")
          text = path.read_text()
          build = os.environ["BUILD_NUMBER"]
          updated, count = re.subn(r"(?m)^app\.build=.*$", f"app.build={build}", text)
          if count != 1:
              raise SystemExit(f"Expected exactly one app.build entry, found {count}")
          path.write_text(updated)
          print(f"Using CFBundleVersion={build}")
          PY

      - name: Build unsigned IPA
        # SKIP_CACHE_CLEAR reuses the (content-hashed, safe) RoboVM AOT cache
        # restored above — cuts rebuild time dramatically on cache hits.
        run: SKIP_CACHE_CLEAR=1 bash forge-gui-ios/pipeline/ios-pipeline.sh ipa

      - name: Read IPA metadata
        id: ipa
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH="$(find forge-gui-ios/target/robovm -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "No IPA found" >&2
            exit 1
          fi

          INFO_ENTRY="$(zipinfo -1 "$IPA_PATH" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -n 1)"
          if [[ -z "$INFO_ENTRY" ]]; then
            echo "Info.plist not found inside IPA" >&2
            exit 1
          fi

          INFO_PLIST="$RUNNER_TEMP/forge-info.plist"
          unzip -p "$IPA_PATH" "$INFO_ENTRY" > "$INFO_PLIST"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          SIZE="$(stat -f%z "$IPA_PATH")"
          SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          TAG="ios-${VERSION}-${BUILD}"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RELEASE_IPA="$RUNNER_TEMP/forge-ios.ipa"
          cp "$IPA_PATH" "$RELEASE_IPA"

          {
            echo "ipa_path=$IPA_PATH"
            echo "release_ipa=$RELEASE_IPA"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "bundle_id=$BUNDLE_ID"
            echo "size=$SIZE"
            echo "sha256=$SHA256"
            echo "tag=$TAG"
            echo "date=$DATE"
            echo "download_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/forge-ios.ipa"
          } >> "$GITHUB_OUTPUT"

          echo "Forge iOS $VERSION ($BUILD)"
          echo "Bundle ID: $BUNDLE_ID"
          echo "SHA-256: $SHA256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: forge-ios-unsigned-ipa-${{ steps.ipa.outputs.build }}
          path: ${{ steps.ipa.outputs.release_ipa }}
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-reports
          path: |
            tmp/jvmdg/work/bridge-report.txt
            tmp/jvmdg/work/gui-ios-bridge-report.txt
            tmp/jvmdg/work/audit-report.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ipa.outputs.tag }}
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD: ${{ steps.ipa.outputs.build }}
          RELEASE_IPA: ${{ steps.ipa.outputs.release_ipa }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          else
            {
              echo "Automated unsigned Forge iOS build for AltStore Classic."
              echo
              echo "Source commit: ${{ steps.sync.outputs.source_sha }}"
            } > "$NOTES_FILE"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_IPA" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Forge iOS $VERSION ($BUILD)" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$RELEASE_IPA" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Forge iOS $VERSION ($BUILD)" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Checkout AltStore feed branch
        uses: actions/checkout@v5
        with:
          ref: altstore
          path: altstore-feed

      - name: Update AltStore Classic source
        env:
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD: ${{ steps.ipa.outputs.build }}
          BUNDLE_ID: ${{ steps.ipa.outputs.bundle_id }}
          RELEASE_DATE: ${{ steps.ipa.outputs.date }}
          DOWNLOAD_URL: ${{ steps.ipa.outputs.download_url }}
          IPA_SIZE: ${{ steps.ipa.outputs.size }}
          IPA_SHA256: ${{ steps.ipa.outputs.sha256 }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("altstore-feed/altstore-source.json")
          data = json.loads(path.read_text())

          bundle_id = os.environ["BUNDLE_ID"]
          apps = data.setdefault("apps", [])
          app = next((item for item in apps if item.get("bundleIdentifier") == bundle_id), None)

          if app is None:
              app = {
                  "name": "Forge",
                  "bundleIdentifier": bundle_id,
                  "developerName": "Card-Forge",
                  "subtitle": "Forge for iOS",
                  "localizedDescription": "Unsigned iOS builds of Forge for installation and updating with AltStore Classic.",
                  "iconURL": "https://raw.githubusercontent.com/GXIzikiel/forge/master/forge-gui-ios/resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png",
                  "category": "games",
                  "versions": [],
                  "appPermissions": {
                      "entitlements": [],
                      "privacy": {
                          "NSLocalNetworkUsageDescription": "Forge uses the local network to discover and connect to multiplayer game servers."
                      }
                  }
              }
              apps.insert(0, app)

          notes = os.environ.get("RELEASE_NOTES", "").strip()
          if not notes:
              notes = f"Automated iOS build from commit {os.environ['SOURCE_SHA'][:7]}."

          release = {
              "version": os.environ["VERSION"],
              "buildVersion": os.environ["BUILD"],
              "date": os.environ["RELEASE_DATE"],
              "localizedDescription": notes,
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "size": int(os.environ["IPA_SIZE"]),
              "sha256": os.environ["IPA_SHA256"]
          }

          versions = app.setdefault("versions", [])
          versions[:] = [
              item for item in versions
              if not (
                  item.get("version") == release["version"]
                  and item.get("buildVersion") == release["buildVersion"]
              )
          ]
          versions.insert(0, release)

          # Keep enough history for rollbacks without letting the feed grow forever.
          del versions[25:]

          data["featuredApps"] = [bundle_id]
          data.setdefault("news", [])

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

          cd altstore-feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json

          if git diff --cached --quiet; then
            echo "AltStore source already up to date."
            exit 0
          fi

          git commit -m "Publish Forge iOS ${VERSION} (${BUILD})"
          git push origin HEAD:altstore

      - name: Publishing summary
        env:
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD: ${{ steps.ipa.outputs.build }}
          TAG: ${{ steps.ipa.outputs.tag }}
          SOURCE_SHA: ${{ steps.sync.outputs.source_sha }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          {
            echo "## Forge iOS published"
            echo
            echo "- Version: **$VERSION ($BUILD)**"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Upstream commit: \`$UPSTREAM_SHA\`"
            echo "- Upstream changes merged today: **$SYNC_CHANGED**"
            echo "- AltStore Classic source:"
            echo "  \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/altstore/altstore-source.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
